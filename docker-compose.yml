version: '3.8'

services:
  # MySQL Database Container
  db:
    image: mysql:8.0
    container_name: meetlocal_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_DATABASE: meetlocal_db
      MYSQL_USER: meetlocal_user
      MYSQL_PASSWORD: meetlocal_pass
    ports:
      - '3306:3306'
    volumes:
      - db_data:/var/lib/mysql
      - ./database/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', 'localhost', '-u', 'meetlocal_user', '-pmeetlocal_pass']
      interval: 5s
      timeout: 5s
      retries: 10

  # Express Node.js Backend Container
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: meetlocal_backend
    restart: always
    ports:
      - '5000:5000'
    environment:
      PORT: 5000
      DB_HOST: db
      DB_PORT: 3306
      DB_USER: meetlocal_user
      DB_PASSWORD: meetlocal_pass
      DB_NAME: meetlocal_db
      JWT_SECRET: meetlocal_super_secret_jwt_key_2026
      JWT_EXPIRES_IN: 7d
    depends_on:
      db:
        condition: service_healthy

  # Next.js Frontend Container
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: meetlocal_frontend
    restart: always
    ports:
      - '3000:3000'
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:5000/api
    depends_on:
      - backend

volumes:
  db_data:
